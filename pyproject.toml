[project]
name = "work-helper-kia"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic==1.20.0",
    "docxtpl>=0.20.2",
    "flet[all]>=0.86.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
python_version = "3.14"  # Укажите вашу версию Python
# Исключаем всю папку с миграциями (укажите её реальное имя, например alembic или migrations)
exclude = [
    "^alembic/",
]

[[tool.mypy.overrides]]
module = "docxtpl.*"
ignore_missing_imports = true

[tool.black]
line-length = 100