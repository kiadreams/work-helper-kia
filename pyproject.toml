[project]
name = "work-helper-kia"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "flet[all]>=0.86.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
]

[tool.mypy]
python_version = "3.14"  # Укажите вашу версию Python
# Исключаем всю папку с миграциями (укажите её реальное имя, например alembic или migrations)
exclude = [
    "^alembic/",
]